name: Specula
options:
  developmentLanguage: fr
  # Repli XcodeGen pour une cible sans identifiant explicite — ici toutes en ont
  # un, dérivé de SPECULA_BUNDLE_PREFIX (voir Signing.xcconfig).
  bundleIdPrefix: com.smalard
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true

# DEVELOPMENT_TEAM et SPECULA_BUNDLE_PREFIX viennent de là, pas d'ici : un
# contributeur pose son Signing.local.xcconfig (ignoré par git) et compile sans
# modifier un seul fichier suivi.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    # Sans ça, aucune extraction : le catalogue dérive du code dès qu'un libellé
    # est reformulé, et la chaîne repart en français dans toutes les langues.
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.2.0" # x-release-please-version
    CURRENT_PROJECT_VERSION: "24"

packages:
  Yams:
    url: https://github.com/jpsim/Yams.git
    from: "5.1.0"

# Schemes partagés (sinon Xcode les autocrée de façon instable à chaque régénération)
schemes:
  Specula-iOS:
    build:
      targets:
        Specula-iOS: all
  Specula-macOS:
    build:
      targets:
        Specula-macOS: all
    # Les tests portent sur du code de `Shared/`, commun aux deux plateformes.
    # Hébergés par la cible macOS, ils tournent sans simulateur.
    test:
      targets:
        - Specula-Tests

targets:
  Specula-iOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
        excludes:
          - "macOS/**"
      - path: Resources
        excludes:
          - "Info-*.plist"
    dependencies:
      - target: Specula-Widgets
        embed: true
      - package: Yams
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(SPECULA_BUNDLE_PREFIX).specula"
        PRODUCT_NAME: Specula
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: Resources/Specula-iOS.entitlements
      properties:
        com.apple.security.application-groups: ["group.$(SPECULA_BUNDLE_PREFIX).specula"]
    info:
      path: Resources/Info-iOS.plist
      properties:
        # Langue de repli quand aucune des cinq ne correspond. `fr` y
        # enverrait un utilisateur allemand ou japonais sur du français ;
        # l'anglais est le secours attendu. Le catalogue garde le français
        # comme langue source, c'est indépendant.
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Specula
        # Lu par SharedState.groupID : le conteneur partagé suit le préfixe
        # d'identifiants, sinon un fork perd ses widgets.
        SpeculaAppGroup: "group.$(SPECULA_BUNDLE_PREFIX).specula"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        UIAppFonts: [Archivo-Variable.ttf]
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "Specula découvre et interroge tes services selfhosted sur le réseau local."
        NSBonjourServices:
          - _http._tcp
          - _https._tcp
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait

  Specula-Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared/Theme.swift
      - path: Shared/Models.swift
      - path: Shared/LiveActivity.swift
      - path: Shared/SharedState.swift
      - path: Resources/Fonts
      - path: Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(SPECULA_BUNDLE_PREFIX).specula.widgets"
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: Resources/Specula-Widgets.entitlements
      properties:
        com.apple.security.application-groups: ["group.$(SPECULA_BUNDLE_PREFIX).specula"]
    info:
      path: Resources/Info-Widgets.plist
      properties:
        # Langue de repli quand aucune des cinq ne correspond. `fr` y
        # enverrait un utilisateur allemand ou japonais sur du français ;
        # l'anglais est le secours attendu. Le catalogue garde le français
        # comme langue source, c'est indépendant.
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Specula
        # Lu par SharedState.groupID : le conteneur partagé suit le préfixe
        # d'identifiants, sinon un fork perd ses widgets.
        SpeculaAppGroup: "group.$(SPECULA_BUNDLE_PREFIX).specula"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [Archivo-Variable.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  Specula-macOS:
    type: application
    platform: macOS
    sources:
      - path: Shared
        excludes:
          - "iOS/**"
      - path: Resources
        excludes:
          - "Info-*.plist"
    dependencies:
      - package: Yams
    entitlements:
      path: Resources/Specula-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # read-write et non read-only : l'import lit un services.yaml choisi par
        # l'utilisateur, l'export en écrit un là où il le demande.
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.application-groups:
          - "group.$(SPECULA_BUNDLE_PREFIX).specula"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(SPECULA_BUNDLE_PREFIX).specula"
        PRODUCT_NAME: Specula
        # Empêche l'injection de code dans le processus. Le sandbox suffirait à
        # l'App Store, mais rien ici ne réclame les dérogations que le runtime
        # durci retire (pas de JIT, pas de chargement de bibliothèque tierce).
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Resources/Info-macOS.plist
      properties:
        # Langue de repli quand aucune des cinq ne correspond. `fr` y
        # enverrait un utilisateur allemand ou japonais sur du français ;
        # l'anglais est le secours attendu. Le catalogue garde le français
        # comme langue source, c'est indépendant.
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Specula
        # Lu par SharedState.groupID : le conteneur partagé suit le préfixe
        # d'identifiants, sinon un fork perd ses widgets.
        SpeculaAppGroup: "group.$(SPECULA_BUNDLE_PREFIX).specula"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        ATSApplicationFontsPath: "."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "Specula découvre et interroge tes services selfhosted sur le réseau local."
        NSBonjourServices:
          - _http._tcp
          - _https._tcp
        NSMainStoryboardFile: ""
        LSMinimumSystemVersion: "26.0"

  # Tests unitaires du code partagé — YAML gethomepage, intégrations,
  # classification des hôtes. Hébergés par l'app macOS : pas de simulateur à
  # démarrer, `xcodebuild test -scheme Specula-macOS` suffit.
  Specula-Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Specula-macOS
    settings:
      base:
        # `PRODUCT_NAME` vaut Specula, pas Specula-macOS : sans ça, XcodeGen
        # déduit le chemin de l'hôte du nom de cible et le bundle reste
        # introuvable au lancement des tests.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Specula.app/Contents/MacOS/Specula"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # Un bundle de test n'a pas d'Info.plist à écrire à la main.
        GENERATE_INFOPLIST_FILE: YES
