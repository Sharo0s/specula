name: Specula
options:
  developmentLanguage: fr
  # Repli XcodeGen pour une cible sans identifiant explicite — ici toutes en ont
  # un, dérivé de SPECULA_BUNDLE_PREFIX (voir Signing.xcconfig).
  bundleIdPrefix: com.smalard
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true

# DEVELOPMENT_TEAM et SPECULA_BUNDLE_PREFIX viennent de là, pas d'ici : un
# contributeur pose son Signing.local.xcconfig (ignoré par git) et compile sans
# modifier un seul fichier suivi.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    # Sans ça, aucune extraction : le catalogue dérive du code dès qu'un libellé
    # est reformulé, et la chaîne repart en français dans toutes les langues.
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0" # x-release-please-version
    CURRENT_PROJECT_VERSION: "21"

packages:
  Yams:
    url: https://github.com/jpsim/Yams.git
    from: "5.1.0"

# Schemes partagés (sinon Xcode les autocrée de façon instable à chaque régénération)
schemes:
  Specula-iOS:
    build:
      targets:
        Specula-iOS: all
  Specula-macOS:
    build:
      targets:
        Specula-macOS: all

targets:
  Specula-iOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
        excludes:
          - "macOS/**"
      - path: Resources
        excludes:
          - "Info-*.plist"
    dependencies:
      - target: Specula-Widgets
        embed: true
      - target: Specula-Watch
        embed: true
      - package: Yams
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(SPECULA_BUNDLE_PREFIX).specula"
        PRODUCT_NAME: Specula
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: Resources/Specula-iOS.entitlements
      properties:
        com.apple.security.application-groups: ["group.$(SPECULA_BUNDLE_PREFIX).specula"]
    info:
      path: Resources/Info-iOS.plist
      properties:
        # Langue de repli quand aucune des cinq ne correspond. `fr` y
        # enverrait un utilisateur allemand ou japonais sur du français ;
        # l'anglais est le secours attendu. Le catalogue garde le français
        # comme langue source, c'est indépendant.
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Specula
        # Lu par SharedState.groupID : le conteneur partagé suit le préfixe
        # d'identifiants, sinon un fork perd widgets et complications.
        SpeculaAppGroup: "group.$(SPECULA_BUNDLE_PREFIX).specula"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        UIAppFonts: [Archivo-Variable.ttf]
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "Specula découvre et interroge tes services selfhosted sur le réseau local."
        NSBonjourServices:
          - _http._tcp
          - _https._tcp
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait

  Specula-Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared/Theme.swift
      - path: Shared/Models.swift
      - path: Shared/LiveActivity.swift
      - path: Shared/SharedState.swift
      - path: Resources/Fonts
      - path: Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(SPECULA_BUNDLE_PREFIX).specula.widgets"
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: Resources/Specula-Widgets.entitlements
      properties:
        com.apple.security.application-groups: ["group.$(SPECULA_BUNDLE_PREFIX).specula"]
    info:
      path: Resources/Info-Widgets.plist
      properties:
        # Langue de repli quand aucune des cinq ne correspond. `fr` y
        # enverrait un utilisateur allemand ou japonais sur du français ;
        # l'anglais est le secours attendu. Le catalogue garde le français
        # comme langue source, c'est indépendant.
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Specula
        # Lu par SharedState.groupID : le conteneur partagé suit le préfixe
        # d'identifiants, sinon un fork perd widgets et complications.
        SpeculaAppGroup: "group.$(SPECULA_BUNDLE_PREFIX).specula"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [Archivo-Variable.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  Specula-macOS:
    type: application
    platform: macOS
    sources:
      - path: Shared
        excludes:
          - "iOS/**"
      - path: Resources
        excludes:
          - "Info-*.plist"
    dependencies:
      - package: Yams
    entitlements:
      path: Resources/Specula-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # read-write et non read-only : l'import lit un services.yaml choisi par
        # l'utilisateur, l'export en écrit un là où il le demande.
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.application-groups:
          - "group.$(SPECULA_BUNDLE_PREFIX).specula"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(SPECULA_BUNDLE_PREFIX).specula"
        PRODUCT_NAME: Specula
        ENABLE_HARDENED_RUNTIME: NO
    info:
      path: Resources/Info-macOS.plist
      properties:
        # Langue de repli quand aucune des cinq ne correspond. `fr` y
        # enverrait un utilisateur allemand ou japonais sur du français ;
        # l'anglais est le secours attendu. Le catalogue garde le français
        # comme langue source, c'est indépendant.
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Specula
        # Lu par SharedState.groupID : le conteneur partagé suit le préfixe
        # d'identifiants, sinon un fork perd widgets et complications.
        SpeculaAppGroup: "group.$(SPECULA_BUNDLE_PREFIX).specula"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        ATSApplicationFontsPath: "."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "Specula découvre et interroge tes services selfhosted sur le réseau local."
        NSBonjourServices:
          - _http._tcp
          - _https._tcp
        NSMainStoryboardFile: ""
        LSMinimumSystemVersion: "26.0"

  Specula-Watch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
        excludes:
          - "iOS/**"
          - "macOS/**"
          - "SpeculaApp.swift"
      - path: Resources
        excludes:
          - "Info-*.plist"
    dependencies:
      - target: Specula-WatchWidgets
        embed: true
      - package: Yams
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(SPECULA_BUNDLE_PREFIX).specula.watchkitapp"
        PRODUCT_NAME: Specula
        TARGETED_DEVICE_FAMILY: "4"
    entitlements:
      path: Resources/Specula-Watch.entitlements
      properties:
        com.apple.security.application-groups: ["group.$(SPECULA_BUNDLE_PREFIX).specula"]
    info:
      path: Resources/Info-Watch.plist
      properties:
        # Langue de repli quand aucune des cinq ne correspond. `fr` y
        # enverrait un utilisateur allemand ou japonais sur du français ;
        # l'anglais est le secours attendu. Le catalogue garde le français
        # comme langue source, c'est indépendant.
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Specula
        # Lu par SharedState.groupID : le conteneur partagé suit le préfixe
        # d'identifiants, sinon un fork perd widgets et complications.
        SpeculaAppGroup: "group.$(SPECULA_BUNDLE_PREFIX).specula"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: "$(SPECULA_BUNDLE_PREFIX).specula"
        WKRunsIndependentlyOfCompanionApp: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "Specula découvre et interroge tes services selfhosted sur le réseau local."
        NSBonjourServices:
          - _http._tcp
          - _https._tcp
        UIAppFonts: [Archivo-Variable.ttf]

  Specula-WatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidgets
      - path: Shared/Theme.swift
      - path: Shared/Models.swift
      - path: Shared/SharedState.swift
      - path: Resources/Fonts
      - path: Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(SPECULA_BUNDLE_PREFIX).specula.watchkitapp.widgets"
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
    entitlements:
      path: Resources/Specula-WatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: ["group.$(SPECULA_BUNDLE_PREFIX).specula"]
    info:
      path: Resources/Info-WatchWidgets.plist
      properties:
        # Langue de repli quand aucune des cinq ne correspond. `fr` y
        # enverrait un utilisateur allemand ou japonais sur du français ;
        # l'anglais est le secours attendu. Le catalogue garde le français
        # comme langue source, c'est indépendant.
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Specula
        # Lu par SharedState.groupID : le conteneur partagé suit le préfixe
        # d'identifiants, sinon un fork perd widgets et complications.
        SpeculaAppGroup: "group.$(SPECULA_BUNDLE_PREFIX).specula"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [Archivo-Variable.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
